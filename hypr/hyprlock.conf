$bg          = rgb(7, 15, 12)
$surface     = rgba(255, 255, 255, 0.050)
$surface_alt = rgba(255, 255, 255, 0.080)

$primary     = rgb(78, 220, 158)
$secondary   = rgb(64, 174, 139)
$accent      = rgb(143, 245, 194)

$text        = rgb(248, 248, 248)
$text_soft   = rgb(225, 225, 225)
$muted       = rgb(190, 190, 190)

$text_shadow = rgba(0, 0, 0, 0.75)
$shadow_color = rgba(255, 255, 255, 0.55)

$border      = rgb(78, 220, 158)

$warning     = rgb(239, 197, 105)
$critical    = rgb(255, 105, 112)

$white       = rgb(255, 255, 255)



============================================================
THEME 4 — Obsidian Ember
Black graphite + copper + warm ivory

Luxurious / cinematic / warm
============================================================

$bg          = rgb(13, 11, 9)
$surface     = rgba(255, 255, 255, 0.050)
$surface_alt = rgba(255, 255, 255, 0.080)

$primary     = rgb(242, 166, 75)
$secondary   = rgb(201, 135, 65)
$accent      = rgb(255, 207, 132)

$text        = rgb(250, 244, 234)
$text_soft   = rgb(216, 203, 184)
$muted       = rgb(145, 129, 106)

$border      = rgb(242, 166, 75)

$warning     = rgb(255, 211, 105)
$critical    = rgb(238, 92, 78)

$white       = rgb(255, 255, 255)



# ============================================================
# GENERAL
# ============================================================

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}


# ============================================================
# BACKGROUND
# ============================================================

background {
    monitor =

    # Get the currently displayed wallpaper from swww

    reload_time = 1
    reload_cmd = awww query | grep -oP 'image: \K.*' | head -n 1

    color = $bg

    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


# ============================================================
# DATE
# ============================================================

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%H:%M")"

    color = $text

    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold

    shadow_passes = 2
    shadow_size = 5
    shadow_color = $text_shadow
    shadow_boost = 1.0

    position = 0, -133

    halign = center
    valign = top
}


# ============================================================
# MAIN TIME
# ============================================================

label {
    monitor =

    text = cmd[update:18000000] echo " "$(date +'%A, %-d %B')" "

    color = $text_soft

    font_size = 42
    font_family = Victor Mono Bold Italic

    shadow_passes = 2
    shadow_size = 3
    shadow_color = $text_shadow
    shadow_boost = 1.0

    position = 0, -20

    halign = center
    valign = center
}


# ============================================================
# MINUTE TIME
# Disabled — kept for reference
# ============================================================

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%M")"

    color = $accent

    font_size = 80
    font_family = JetBrainsMono Nerd Font ExtraBold

    position = 0, -400

    halign = center
    valign = top
}


# ============================================================
# SECONDS TIME
# Disabled — kept for reference
# ============================================================

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%S")"

    color = $secondary

    font_size = 80
    font_family = JetBrainsMono Nerd Font ExtraBold

    position = 0, -500

    halign = center
    valign = top
}


