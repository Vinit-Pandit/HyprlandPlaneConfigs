# ============================================================
# USER
# ============================================================

label {
    monitor =

    text =  $USER

    color = $accent

    font_size = 40
    font_family = JetBrainsMono Nerd Font ExtraBold

    position = 0, 300

    halign = center
    valign = bottom
}


# ============================================================
# PASSWORD INPUT
# ============================================================

input-field {
    monitor =

    size = 500, 80
    outline_thickness = 5

    dots_size = 0.20
    dots_spacing = 0.25
    dots_center = true

    outer_color = $border
    inner_color = $surface

    capslock_color = $warning
    font_color = $text

    shadow_passes = 2
    shadow_size = 5
    shadow_color = $text_shadow
    shadow_boost = 1.0

    fade_on_empty = false

    font_family = Victor Mono Bold Oblique

    placeholder_text = Password
    hide_input = false

    position = 0, 100

    halign = center
    valign = bottom

    rounding = 30
}


# ============================================================
# KEYBOARD LAYOUT
# ============================================================

label {
    monitor =

    text = $LAYOUT

    color = $text_soft

    font_size = 20
    font_family = Victor Mono Bold Oblique

    position = 0, 40

    halign = center
    valign = bottom
}


# ============================================================
# UPTIME
# ============================================================

label {
    monitor =

    text = cmd[update:60000] echo " "$(uptime -p || $Scripts/UptimeNixOS.sh)" "

    color = $muted

    font_size = 20
    font_family = Victor Mono Bold Oblique

    position = 0, 0

    halign = right
    valign = bottom
}


# ============================================================
# BATTERY
# ============================================================

label {
    monitor =

    text = cmd[update:1000] echo " "$($Scripts/Battery.sh)" "

    color = $muted

    font_size = 20
    font_family = Victor Mono Bold Oblique

    position = 0, 40

    halign = right
    valign = bottom
}


